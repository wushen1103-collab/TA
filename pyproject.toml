[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fcsr-sterimol"
version = "1.0.0"
description = "Frame-calibrated Sterimol reconstruction on conformer ensembles"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "joblib==1.5.3",
  "rdkit==2026.3.5",
  "matplotlib==3.10.0",
  "tqdm==4.70.0",
  "tabulate==0.10.0",
  "gdown==6.1.0",
]

[tool.setuptools]
packages = ["fcsr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
